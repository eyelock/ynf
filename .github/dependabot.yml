version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep Go modules up to date: the root module and each module under sandbox/.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "gomod"
    directory: "/sandbox/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "gomod"
    directory: "/sandbox/calibrate"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "gomod"
    directory: "/sandbox/seed"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keep base images up to date
  - package-ecosystem: "docker"
    directory: "/images/factory"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "docker"
    directory: "/sandbox/images/agent"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "docker"
    directory: "/sandbox/images/probe"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Keep Terraform providers up to date
  - package-ecosystem: "terraform"
    directory: "/infra/github"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "terraform"
    directory: "/infra/terraform-state"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
  - package-ecosystem: "terraform"
    directory: "/sandbox/terraform"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
