name: release

on:
  push:
    tags:
      - "v*"

env:

permissions:
  contents: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound to the workflow
  # identity; without it the signs: block in .goreleaser.yml cannot obtain one.
  id-token: write

jobs:
  check:
    name: make check (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - run: make check

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # goreleaser's signs: and sboms: blocks shell out to these.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Writes the release here and the formula to eyelock/homebrew-tap.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  factory-image:
    # ynf's factory image (ADR-009): ynh's image at the version images/factory/versions.env pairs,
    # with this release's ynf and that ynm, for amd64 and arm64.
    name: Factory image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build context
        id: context
        env:
          # ynm's releases are private: the release token reads them.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          . images/factory/versions.env
          version="${GITHUB_REF_NAME#v}"
          ctx="$RUNNER_TEMP/factory"
          mkdir -p "$ctx/ynh" "$ctx/ynm"
          cp images/factory/Dockerfile "$ctx/"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/eyelock/ynf.Version=$version" -o "$ctx/ynf-linux-$arch" ./cmd/ynf
          done
          gh release download "v$YNM_VERSION" -R eyelock/ynm -p "ynm_${YNM_VERSION}_slim.tar.gz" -D "$ctx"
          tar -xzf "$ctx/ynm_${YNM_VERSION}_slim.tar.gz" -C "$ctx/ynm"
          {
            echo "dir=$ctx"
            echo "ynh=$YNH_VERSION"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ steps.context.outputs.dir }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            YNH_BASE=ghcr.io/eyelock/ynh:${{ steps.context.outputs.ynh }}
            YNF_VERSION=${{ steps.context.outputs.version }}
          tags: |
            ghcr.io/eyelock/ynf-factory:${{ steps.context.outputs.version }}
            ghcr.io/eyelock/ynf-factory:latest
