name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Keyless cosign signing exchanges this for a short-lived certificate bound to the workflow
  # identity; without it the signs: block in .goreleaser.yml cannot obtain one.
  id-token: write

jobs:
  check:
    name: make check (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          install-only: true
      - run: make check

  release:
    name: Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7
        with:
          go-version-file: go.mod
      # goreleaser's signs: and sboms: blocks shell out to these.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Writes the release here and the formula to eyelock/homebrew-tap.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
