name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # The ynr release that `conformance` runs, without the leading v. The one place it is pinned.
  YNR_VERSION: 0.2.0
  # The ynh release the full-chain check runs, without the leading v.
  YNH_VERSION: 0.11.0
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - name: make check
        run: make check
      - name: build
        run: make build && ./bin/ynf version

  registry:
    # ynf's telemetry registry is an OpenTelemetry Weaver registry (ynr ADR-007): Weaver checks it.
    runs-on: ubuntu-latest
    env:
      WEAVER_VERSION: v0.27.0
    steps:
      - uses: actions/checkout@v4
      - name: weaver registry check
        run: |
          set -eu
          curl -fsSL "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/weaver-x86_64-unknown-linux-gnu/weaver registry check -r telemetry/registry

  conformance:
    # ynr conformance (ynr ADR-008): ynf's own scenarios, offline, against a pinned ynr release.
    # ynf finds tools only on PATH, so both binaries are put there; ynr is never built from source or installed from a package manager.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ynr and its stub vendor, checked against the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/ynr-download"
          bin="$RUNNER_TEMP/ynr-bin"
          mkdir -p "$dl" "$bin"
          ynr="ynr_${YNR_VERSION}_linux_amd64.tar.gz"
          stub="ynr-stub-vendor_${YNR_VERSION}_linux_amd64.tar.gz"
          gh release download "v${YNR_VERSION}" -R eyelock/ynr -D "$dl" -p "$ynr" -p "$stub" -p checksums.txt
          cd "$dl"
          grep -E " (${ynr}|${stub})\$" checksums.txt > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 2 ]
          sha256sum --check --strict wanted.txt
          tar -xzf "$ynr" -C "$bin" ynr
          tar -xzf "$stub" -C "$bin" ynr-stub-vendor
          echo "$bin" >> "$GITHUB_PATH"
      - name: ynr conformance
        run: |
          set -euo pipefail
          ynr version
          make conformance CONFORMANCE_FORMAT=json | tee "$RUNNER_TEMP/conformance.json"
      - name: ynh, checked against the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/ynh-download"
          bin="$RUNNER_TEMP/ynh-bin"
          mkdir -p "$dl" "$bin"
          ynh="ynh_${YNH_VERSION}_linux_amd64.tar.gz"
          gh release download "v${YNH_VERSION}" -R eyelock/ynh -D "$dl" -p "$ynh" -p checksums.txt
          cd "$dl"
          grep -E " ${ynh}\$" checksums.txt > wanted.txt
          [ "$(wc -l < wanted.txt)" -eq 1 ]
          sha256sum --check --strict wanted.txt
          tar -xzf "$ynh" -C "$bin" ynh
          echo "$bin" >> "$GITHUB_PATH"
      - name: full chain, a ynf step through ynh and the relay into one trace
        run: |
          set -euo pipefail
          ynh version
          make fullchain

  all-clear:
    # The one check the rulesets require (infra/github/branches.tf). It runs even when a job it needs
    # fails: a skipped required check counts as passing, so without if: always() a red PR could merge.
    name: All Clear
    runs-on: ubuntu-latest
    needs: [check, registry, conformance]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || \
             [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
