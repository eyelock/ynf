# yaml-language-server: $schema=https://eyelock.github.io/ynf/schema/lanes.schema.json
#
# The sandbox's factory: twelve lanes, one per kind of work, so every ynf path has a lane to run in.
# One, deps, is declared in the configuration repository (sandbox/factory-seed) and only
# switched off here. Another, relaxed, is wrong on purpose and never runs: see it below.
# Every fixture carries a `pkg:<path>` label; lanes use it to scope the harness's sensors to the
# part of the repository the work is about, so a run is judged on its own debt, not everyone's.
# The ynh lanes run in an agent image ynf builds from this repository's own harness on
# ynf-sandbox-agent:latest (sandbox/images/agent, `make agent-image`), which has the Go toolchain
# and golangci-lint the sensors need. ANTHROPIC_API_KEY is passed in by name; api.anthropic.com is
# allowed through the egress proxy without being listed. They run with ynh's --auto-approve edits:
# inside the container the worker edits without asking, and still cannot run commands; ynh's
# sensors check its work between turns. The base needs a ynh with capabilities 0.9.0.
# A scope may only narrow a sensor the harness declares (ADR-006): its command is the harness's,
# with a path word replaced by one beneath it, so no flag, environment setting or cache location
# can ride along. ynf sets golangci-lint's cache per run (GOLANGCI_LINT_CACHE, in the run folder),
# and what a lint run blocks on is ynh's baseline ratchet's.
version: 1

defaults:
  executor: docker
  attempts: 3
  retention: 30d
  egress:
    allow: [proxy.golang.org, sum.golang.org, storage.googleapis.com]

lanes:
  lint-paydown:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:lint"'
        every: 5m
    run:
      runner: ynh
      env: [ANTHROPIC_API_KEY]
      ynh:
        harness: .
        base: ynf-sandbox-agent:latest
        focus: tidy
        auto_approve: edits
        sensor_scope:
          lint: 'golangci-lint run ./{label.pkg}/...'
          test: 'go test -count=1 ./{label.pkg}/...'
          docs: 'sh scripts/check-docs.sh {label.pkg}'
    when:
      converged: open_pr
      ci_failed: { retry: 2, then: escalate }
      changes_requested: { resume_with: review_comments, max: 3 }
      outcome.budget: { retry: 1, then: escalate }
      outcome.stuck: escalate
      outcome.tamper: escalate
    pr:
      allowed_paths: ['internal/**']
    stop:
      max_open_proposals: 5

  doc-drift:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:docs"'
        every: 5m
    run:
      runner: ynh
      env: [ANTHROPIC_API_KEY]
      ynh:
        harness: .
        base: ynf-sandbox-agent:latest
        focus: docs
        auto_approve: edits
        sensor_scope:
          lint: 'golangci-lint run ./{label.pkg}/...'
          test: 'go test -count=1 ./{label.pkg}/...'
          docs: 'sh scripts/check-docs.sh {label.pkg}'
    when:
      converged: open_pr
      ci_failed: { retry: 1, then: escalate }
      outcome.stuck: escalate
      outcome.tamper: escalate
    pr:
      allowed_paths: ['README.md', 'docs/**', 'internal/status/**']

  gofmt:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:fmt"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv: ['gofmt', '-w', './{label.pkg}']
      egress:
        allow: []
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']
    # What ynf writes on the ticket as it works: the trigger label goes once the item is taken on,
    # so nothing finds it twice, and people can see where it is.
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:fmt] }
      on_propose:  { add: [ynf:proposed], remove: [ynf:working] }
      on_review:   { add: [ynf:in-review], remove: [ynf:proposed] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working, ynf:proposed] }

  # A command that always fails, so its item escalates with sig/outcome/error and leaves a failure
  # memory, with no model: `make e2e-memory-outage` takes ynm away and checks that memory queues and
  # arrives.
  outage:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:outage"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv: ['sh', '-c', 'echo this lane always fails >&2; exit 3']
      egress:
        allow: []
    when:
      converged: open_pr
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:outage] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working] }

  # A run that writes its own telemetry into its spool folder, as ynh and the vendor would, with no
  # model: one span, in the trace ynf gave it (TRACEPARENT), claiming a factory it is not in. `make
  # e2e` checks ynr stamped the run's provenance and the lane the manifest names over that claim,
  # and that the record reached the receiver (ynr ADR-003, ynf ADR-011). Then gofmt, so it proposes.
  spool:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:spool"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv:
          - sh
          - -c
          - |
            tp=${TRACEPARENT#00-}; tid=${tp%%-*}; rest=${tp#*-}; parent=${rest%%-*}
            [ -d "$YNR_SPOOL" ] && printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"sandbox-probe"}},{"key":"ynf.lane","value":{"stringValue":"forged/lane#claimed"}},{"key":"ynr.provenance","value":{"stringValue":"factory"}}]},"scopeSpans":[{"scope":{"name":"probe"},"spans":[{"traceId":"%s","spanId":"00000000000000aa","parentSpanId":"%s","name":"probe.work","kind":1,"startTimeUnixNano":"1000000000","endTimeUnixNano":"2000000000"}]}]}]}\n' "$tid" "$parent" > "$YNR_SPOOL/probe-$$.jsonl"
            gofmt -w ./{label.pkg}
      egress:
        allow: []
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:spool] }
      on_propose:  { add: [ynf:proposed], remove: [ynf:working] }
      on_review:   { add: [ynf:in-review], remove: [ynf:proposed] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working, ynf:proposed] }

  # The same record from a run that keeps its image's own user (ynf-sandbox-probe, built by `make
  # e2e`: uid 10042, not the folder's owner), with no model spend. `make e2e` checks the manifest
  # names that user and that the record reached the receiver with run provenance and the lane the
  # manifest names (ynr ADR-003, ynf ADR-007, ADR-011).
  spool-image:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:spool-image"'
        every: 5m
    run:
      runner: command
      command:
        image: ynf-sandbox-probe:latest
        image_user: true
        argv:
          - sh
          - -c
          - |
            tp=${TRACEPARENT#00-}; tid=${tp%%-*}; rest=${tp#*-}; parent=${rest%%-*}
            echo "image-user-uid=$(id -u)"
            [ -d "$YNR_SPOOL" ] && printf '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"sandbox-probe"}},{"key":"ynf.lane","value":{"stringValue":"forged/lane#claimed"}},{"key":"ynr.provenance","value":{"stringValue":"factory"}}]},"scopeSpans":[{"scope":{"name":"probe"},"spans":[{"traceId":"%s","spanId":"00000000000000bb","parentSpanId":"%s","name":"probe.image","kind":1,"startTimeUnixNano":"1000000000","endTimeUnixNano":"2000000000"}]}]}]}\n' "$tid" "$parent" > "$YNR_SPOOL/probe-$$.jsonl"
            gofmt -w ./{label.pkg}
      egress:
        allow: []
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:spool-image] }
      on_propose:  { add: [ynf:proposed], remove: [ynf:working] }
      on_review:   { add: [ynf:in-review], remove: [ynf:proposed] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working, ynf:proposed] }

  # A run that fills its spool folder: it writes 20 MiB there, far past the run quota, and goes on
  # to gofmt. It prints what dd said and how much the folder held after two seconds. `make e2e`
  # checks the folder was held to the quota and the run still proposed: by the volume's own limit
  # where the host gives one (dd fails), else by ynf taking the excess away (ADR-007).
  spool-flood:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:spool-flood"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv:
          - sh
          - -c
          - |
            [ -d "$YNR_SPOOL" ] && dd if=/dev/zero of="$YNR_SPOOL/flood.bin" bs=1048576 count=20 2>/dev/null
            echo "flood-dd-exit=$?"
            sleep 2
            echo "flood-bytes=$(wc -c < "$YNR_SPOOL/flood.bin")"
            gofmt -w ./{label.pkg}
      egress:
        allow: []
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:spool-flood] }
      on_propose:  { add: [ynf:proposed], remove: [ynf:working] }
      on_review:   { add: [ynf:in-review], remove: [ynf:proposed] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working, ynf:proposed] }

  # gofmt again, with no runner named (ADR-012): the harness runs it as ynh when ynh is detected
  # on the host, else the command does, each in its own image. `make e2e` hides ynh, so it runs
  # the command at no cost.
  detect:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:detect"'
        every: 5m
    run:
      env: [ANTHROPIC_API_KEY]
      ynh:
        harness: .
        base: ynf-sandbox-agent:latest
        focus: tidy
        auto_approve: edits
        sensor_scope:
          lint: 'golangci-lint run ./{label.pkg}/...'
          test: 'go test -count=1 ./{label.pkg}/...'
          docs: 'sh scripts/check-docs.sh {label.pkg}'
      command:
        image: golang:1.26-alpine
        argv: ['gofmt', '-w', './{label.pkg}']
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']
    labels:
      on_claim:    { add: [ynf:working], remove: [ynf:detect] }
      on_propose:  { add: [ynf:proposed], remove: [ynf:working] }
      on_review:   { add: [ynf:in-review], remove: [ynf:proposed] }
      on_escalate: { add: [ynf:needs-human], remove: [ynf:working, ynf:proposed] }

  # gofmt, slowly: the run waits 20 seconds first, so `make e2e` can kill ynf while it is in
  # progress and check that another ynf restarts it (ADR-005: restart, not resume).
  reclaim:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:reclaim"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv: ['sh', '-c', 'sleep 20 && gofmt -w ./{label.pkg}']
      egress:
        allow: []
    when:
      converged: open_pr
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']

  fix-ci:
    kind: adopt
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:pr is:open label:"ynf:fix-ci"'
        every: 5m
    guards:
      eligible: 'facts.pr.checks.exists(c, c.required && c.conclusion == "failure") && !facts.pr.draft && !facts.pr.fork'
    run:
      runner: ynh
      env: [ANTHROPIC_API_KEY]
      ynh:
        harness: .
        base: ynf-sandbox-agent:latest
        focus: fix-ci
        auto_approve: edits
        sensor_scope:
          lint: 'golangci-lint run ./{label.pkg}/...'
          test: 'go test -count=1 ./{label.pkg}/...'
          docs: 'sh scripts/check-docs.sh {label.pkg}'
    when:
      converged: push_commit
      ci_failed: { retry: 1, then: escalate }
      outcome.stuck: escalate
      outcome.tamper: escalate
    pr:
      allowed_paths: ['internal/**']

  # Adopts a pull request into gate/required-checks, a branch whose ruleset requires a check that no
  # workflow reports. The command, which adds a comment line, runs without a model; what the fixture proves is that ynf, once
  # every check that did report has passed, still does not move the item to in_review, because a
  # required check has not started (see `make e2e`, the gate stage).
  gate:
    kind: adopt
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:pr is:open label:"ynf:gate"'
        every: 5m
    run:
      runner: command
      image: golang:1.26-alpine
      command:
        argv: ['sh', '-c', 'printf "\\n// Checked by the gate lane.\\n" >> ./{label.pkg}/gate.go']
      egress:
        allow: []
    when:
      converged: push_commit
      ci_failed: escalate
    pr:
      allowed_paths: ['**/*.go']

  # A lane that does what a scope must not: it replaces the lint sensor's command with `true`, so
  # the run could never fail lint. ynf refuses it before anything runs, as operator_error, and
  # `make e2e` starts the relaxed-scope fixture on it to see that happen; no model is called.
  relaxed:
    kind: originate
    intake:
      - github.search: 'repo:eyelock/ynf-sandbox is:issue is:open label:"ynf:relaxed"'
        every: 5m
    run:
      runner: ynh
      env: [ANTHROPIC_API_KEY]
      ynh:
        harness: .
        base: ynf-sandbox-agent:latest
        focus: tidy
        auto_approve: edits
        sensor_scope:
          lint: 'true'
          test: 'go test -count=1 ./{label.pkg}/...'
    when:
      converged: open_pr
    pr:
      allowed_paths: ['internal/**']

  deps:
    # The deps lane comes from the configuration repository, eyelock/ynf-sandbox-factory, where
    # it is on. This repository turns it off with one key: its lanes win, key by key (ADR-006).
    enabled: false
