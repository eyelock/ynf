<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ynf</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="ynf: your named factory. The outer loop around ynh agent runs.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/sidebar.min.css">
  <style>
    :root { --theme-color: #0066cc; --sidebar-width: 280px; }
    .sidebar-nav > ul > li > p { font-weight: 600; text-transform: uppercase; font-size: 0.9em; color: var(--theme-color); margin-top: 1em; }
    .markdown-section code { background-color: #f8f8f8; border-radius: 2px; color: #e96900; font-family: 'SF Mono', Monaco, Menlo, Consolas, 'Courier New', monospace; margin: 0 2px; padding: 3px 5px; }
    .markdown-section pre > code { background-color: #f8f8f8; color: #333; }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'ynf',
      repo: 'https://github.com/eyelock/ynf',
      loadSidebar: true,
      // Relative links resolve from the containing file, as GitHub does; sidebar links are
      // root-absolute because the sidebar renders on every page.
      relativePath: true,
      alias: { '/how-to/_sidebar.md': '/_sidebar.md', '/reference/_sidebar.md': '/_sidebar.md', '/explanation/_sidebar.md': '/_sidebar.md', '/adr/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      search: { maxAge: 86400000, paths: 'auto', placeholder: 'Search docs...', noData: 'No results found', depth: 4 },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
      sidebarDisplayLevel: 1,
      plugins: [
        function(hook) {
          hook.afterEach(function(html, next) {
            next(html + '<hr/><footer><span>Powered by <a href="https://docsify.js.org" target="_blank">docsify</a></span></footer>');
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
