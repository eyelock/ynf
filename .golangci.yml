version: "2"
linters:
  default: standard
  enable:
    - misspell
    - revive
    - unconvert
    - errorlint
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: errorf
formatters:
  enable:
    - gofmt
